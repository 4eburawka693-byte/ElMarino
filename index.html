<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Інтернет-Магазин</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --text-muted: #7f8c8d;
      --accent-color: #27ae60;
      --accent-hover: #219150;
      --danger-color: #e74c3c;
      --border-radius: 12px;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 80px;
    }

    /* Header & Controls */
    header {
      position: sticky;
      top: 0;
      background: var(--card-bg);
      z-index: 100;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .search-box {
      margin-bottom: 10px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #dfe6e9;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
      background: #f8f9fa;
    }

    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .categories-scroll::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 6px 14px;
      border: 1px solid #dfe6e9;
      background: #fff;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    /* Banner */
    .banner-container {
      padding: 12px 16px 0 16px;
    }
    .banner-img {
      width: 100%;
      border-radius: var(--border-radius);
      object-fit: cover;
      max-height: 160px;
      box-shadow: var(--shadow);
    }

    /* Product Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      padding: 16px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      background: #eee;
      cursor: pointer;
    }

    .product-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .product-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-color);
      margin-top: auto;
      margin-bottom: 8px;
    }

    .opt-badge {
      display: inline-block;
      font-size: 10px;
      background: #ffeaa7;
      color: #d63031;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .btn-add {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    /* Floating Cart Button */
    .cart-float-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
      cursor: pointer;
      z-index: 99;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Modals & Overlays */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-muted);
    }

    /* Product Details */
    .modal-img-slider {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: contain;
      border-radius: 12px;
      background: #f8f9fa;
      margin-bottom: 12px;
    }

    .option-group {
      margin-bottom: 12px;
    }
    .option-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .option-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      padding: 6px 12px;
      border: 1px solid #dfe6e9;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .chip.selected {
      border-color: var(--accent-color);
      background: #e8f8f0;
      color: var(--accent-color);
      font-weight: 600;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #dfe6e9;
      border-radius: 8px;
      font-size: 14px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 2000;
      display: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* Reviews Section */
    .reviews-list {
      margin-top: 16px;
      border-top: 1px solid #eee;
      padding-top: 12px;
    }
    .review-card {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .review-author {
      font-weight: bold;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Пошук товарів..." oninput="filterProducts()">
    </div>
    <div class="categories-scroll" id="categoriesList">
      <button class="cat-btn active" onclick="selectCategory('all', this)">Усі</button>
    </div>
  </header>

  <!-- Banner -->
  <div class="banner-container">
    <img src="https://i.postimg.cc/85zX3VbZ/banner.jpg" class="banner-img" alt="Акція" onerror="this.style.display='none'">
  </div>

  <!-- Products Container -->
  <main class="products-grid" id="productsGrid"></main>

  <!-- Cart Floating Button -->
  <button class="cart-float-btn" id="cartBtn" onclick="openCartModal()">
    🛒 Кошик (<span id="cartCount">0</span>)
  </button>

  <!-- Product Detail Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Назва товару</h3>
        <button class="close-btn" onclick="closeModal('productModal')">&times;</button>
      </div>
      <img src="" id="modalImg" class="modal-img-slider" alt="">
      <p class="product-price" id="modalPrice">0 грн</p>
      <div id="modalOptions"></div>
      <p id="modalDescription" style="font-size: 13px; color: var(--text-muted); margin: 12px 0; white-space: pre-line;"></p>
      <button class="btn-add" id="modalAddBtn">Додати у кошик</button>

      <!-- Reviews -->
      <div class="reviews-list">
        <h4>Відгуки</h4>
        <div id="reviewsContainer"></div>
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Кошик</h3>
        <button class="close-btn" onclick="closeModal('cartModal')">&times;</button>
      </div>
      <div id="cartItems"></div>
      <hr style="margin: 12px 0; border: none; border-top: 1px solid #eee;">
      <p style="font-weight: bold; font-size: 16px; text-align: right;" id="cartTotal">Разом: 0 грн</p>
      <button class="btn-add" style="margin-top: 12px;" onclick="showCheckoutModal()">Оформити замовлення</button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Оформлення замовлення</h3>
        <button class="close-btn" onclick="closeModal('checkoutModal')">&times;</button>
      </div>
      <form id="orderForm" onsubmit="handleOrderSubmit(event)">
        <div class="form-group">
          <label>Ім'я та Прізвище *</label>
          <input type="text" id="custName" required>
        </div>
        <div class="form-group">
          <label>Телефон *</label>
          <input type="tel" id="custPhone" placeholder="+380..." required>
        </div>
        <div class="form-group">
          <label>Місто та № відділення Нової Пошти *</label>
          <input type="text" id="custAddress" required>
        </div>
        <div class="form-group">
          <label>Спосіб оплати</label>
          <select id="custPayment">
            <option value="Передплата">Передплата на картку</option>
            <option value="Накладений платіж">Накладений платіж</option>
          </select>
        </div>
        <div class="form-group">
          <label>Коментар до замовлення</label>
          <textarea id="custComment" rows="2"></textarea>
        </div>
        <button type="submit" class="btn-add" style="margin-top: 8px;">Підтвердити замовлення</button>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // --- Конфігурація ---
    const SHEET_ID = '1-69oT-jYw9S0fO4M4p3T4H9lQk1tV9A'; // Вкажіть свій ID Google Таблиці
    const REVIEWS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('відгуки')}`;
    const PRODUCTS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`;

    const BOT_TOKEN = '8775134268:AAE9lKCPpZWs4E94uwAbMR26O2GPaJ8osDw'; 
    const CHAT_ID = '5263239405';

    // Зчитування оптового режиму з URL (наприклад: ?mode=opt)
    const urlParams = new URLSearchParams(window.location.search);
    const IS_OPT = urlParams.get('mode') === 'opt';

    let productsData = [];
    let reviewsData = [];
    let cart = [];
    let selectedCategory = 'all';
    let currentProductOptions = {};

    // Ініціалізація Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // --- Завантаження даних ---
    document.addEventListener('DOMContentLoaded', () => {
      fetchProducts();
      fetchReviews();
    });

    function fetchProducts() {
      fetch(PRODUCTS_URL)
        .then(res => res.text())
        .then(csvText => {
          productsData = parseCSV(csvText);
          renderCategories();
          renderProducts(productsData);
        })
        .catch(err => showToast("Помилка завантаження товарів!"));
    }

    function fetchReviews() {
      fetch(REVIEWS_URL)
        .then(res => res.text())
        .then(csvText => {
          reviewsData = parseCSV(csvText);
        })
        .catch(() => console.warn("Відгуки не завантажено або вкладка відсутня"));
    }

    // Простий CSV парсер
    function parseCSV(text) {
      const lines = text.split('\n').filter(line => line.trim() !== '');
      if (lines.length <= 1) return [];
      
      const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
      
      return lines.slice(1).map(line => {
        // Регулярка для розділення по комам з урахуванням лапок
        const matches = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
        const row = {};
        
        // Фоллбек на базове розділення якщо регулярка повернула мало даних
        const cells = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        
        cells.forEach((val, idx) => {
          let cleanVal = val.trim().replace(/^"|"$/g, '').replace(/""/g, '"');
          row[idx] = cleanVal;
        });
        return row;
      });
    }

    // --- Рендеринг товарів та категорій ---
    function renderCategories() {
      const categories = new Set();
      productsData.forEach(p => {
        if (p[1]) {
          const mainCat = p[1].split('/')[0].trim();
          categories.add(mainCat);
        }
      });

      const container = document.getElementById('categoriesList');
      container.innerHTML = `<button class="cat-btn active" onclick="selectCategory('all', this)">Усі</button>`;
      
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.innerText = cat;
        btn.onclick = () => selectCategory(cat, btn);
        container.appendChild(btn);
      });
    }

    function selectCategory(cat, btnElement) {
      selectedCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      filterProducts();
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = productsData.filter(p => {
        const title = (p[0] || '').toLowerCase();
        const category = (p[1] || '').toLowerCase();
        const tags = (p[7] || '').toLowerCase();
        
        const matchesSearch = title.includes(query) || tags.includes(query);
        const matchesCat = selectedCategory === 'all' || category.startsWith(selectedCategory.toLowerCase());
        
        return matchesSearch && matchesCat;
      });

      renderProducts(filtered);
    }

    function renderProducts(list) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      if (list.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Товари не знайдені</p>';
        return;
      }

      list.forEach((p, idx) => {
        const price = IS_OPT ? (p[3] || p[2]) : p[2];
        const images = (p[5] || '').split(',');
        const mainImg = images[0]?.trim() || 'https://images.unsplash.com/photo-1560343090-f0409e92791a?w=300';

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${mainImg}" class="product-img" onclick="openProductModal(${idx})" alt="${p[0]}">
          <div class="product-info">
            ${IS_OPT ? '<span class="opt-badge">ОПТ</span>' : ''}
            <div class="product-title">${p[0]}</div>
            <div class="product-price">${price} грн</div>
            <button class="btn-add" onclick="openProductModal(${idx})">Вибрати</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // --- Модальне вікно товару ---
    function openProductModal(index) {
      const p = productsData[index];
      if (!p) return;

      currentProductOptions = {};
      document.getElementById('modalTitle').innerText = p[0];
      
      const price = IS_OPT ? (p[3] || p[2]) : p[2];
      document.getElementById('modalPrice').innerText = `${price} грн`;
      document.getElementById('modalDescription').innerText = p[4] || '';

      const images = (p[5] || '').split(',').map(s => s.trim());
      const mainImg = images[0] || 'https://images.unsplash.com/photo-1560343090-f0409e92791a?w=300';
      document.getElementById('modalImg').src = mainImg;

      // Варіанти товару (Розмір, Колір тощо)
      const optionsContainer = document.getElementById('modalOptions');
      optionsContainer.innerHTML = '';
      
      if (p[6]) {
        const groups = p[6].split(';');
        groups.forEach(groupStr => {
          const [name, valuesStr] = groupStr.split(':');
          if (name && valuesStr) {
            const grpName = name.trim();
            const values = valuesStr.split(',').map(v => v.trim());
            
            const groupDiv = document.createElement('div');
            groupDiv.className = 'option-group';
            groupDiv.innerHTML = `<div class="option-title">${grpName}:</div>`;
            
            const chipsDiv = document.createElement('div');
            chipsDiv.className = 'option-chips';
            
            values.forEach((val, vIdx) => {
              const chip = document.createElement('div');
              chip.className = `chip ${vIdx === 0 ? 'selected' : ''}`;
              chip.innerText = val;
              if (vIdx === 0) currentProductOptions[grpName] = val;

              chip.onclick = () => {
                chipsDiv.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
                chip.classList.add('selected');
                currentProductOptions[grpName] = val;
              };
              chipsDiv.appendChild(chip);
            });

            groupDiv.appendChild(chipsDiv);
            optionsContainer.appendChild(groupDiv);
          }
        });
      }

      // Додавання до кошика з модалки
      document.getElementById('modalAddBtn').onclick = () => {
        addToCart(p[0], price, currentProductOptions, mainImg);
        closeModal('productModal');
        showToast("Товар додано в кошик!");
      };

      // Рендер відгуків
      renderProductReviews(p[0]);

      document.getElementById('productModal').style.display = 'flex';
    }

    function renderProductReviews(productName) {
      const container = document.getElementById('reviewsContainer');
      container.innerHTML = '';
      
      const filtered = reviewsData.filter(r => r[0] === productName);
      if (filtered.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); font-size: 12px;">Відгуків поки немає</p>';
        return;
      }

      filtered.forEach(r => {
        const item = document.createElement('div');
        item.className = 'review-card';
        item.innerHTML = `
          <div class="review-author">${r[1] || 'Анонім'} ${'⭐'.repeat(parseInt(r[2]) || 5)}</div>
          <div>${r[3] || ''}</div>
        `;
        container.appendChild(item);
      });
    }

    // --- Кошик ---
    function addToCart(title, price, options, img) {
      const itemKey = title + JSON.stringify(options);
      const existing = cart.find(i => i.key === itemKey);

      if (existing) {
        existing.qty++;
      } else {
        cart.push({
          key: itemKey,
          title,
          price: parseFloat(price) || 0,
          options: { ...options },
          img,
          qty: 1
        });
      }
      updateCartCount();
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartCount').innerText = count;
    }

    function openCartModal() {
      const container = document.getElementById('cartItems');
      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Кошик порожній</p>';
      } else {
        cart.forEach((item, idx) => {
          const optStr = Object.entries(item.options).map(([k,v]) => `${k}: ${v}`).join(', ');
          const row = document.createElement('div');
          row.style.cssText = 'display: flex; gap: 10px; align-items: center; margin-bottom: 10px;';
          row.innerHTML = `
            <img src="${item.img}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px;">
            <div style="flex-grow: 1;">
              <div style="font-size: 13px; font-weight: 600;">${item.title}</div>
              <div style="font-size: 11px; color: var(--text-muted);">${optStr}</div>
              <div style="font-size: 13px; font-weight: bold; color: var(--accent-color);">${item.price} грн</div>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <button onclick="changeQty(${idx}, -1)" style="padding: 2px 8px;">-</button>
              <span>${item.qty}</span>
              <button onclick="changeQty(${idx}, 1)" style="padding: 2px 8px;">+</button>
            </div>
          `;
          container.appendChild(row);
        });
      }

      calculateTotal();
      document.getElementById('cartModal').style.display = 'flex';
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      updateCartCount();
      openCartModal();
    }

    function calculateTotal() {
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('cartTotal').innerText = `Разом: ${total} грн`;
    }

    function showCheckoutModal() {
      if (cart.length === 0) {
        showToast("Кошик порожній!");
        return;
      }
      closeModal('cartModal');
      document.getElementById('checkoutModal').style.display = 'flex';
    }

    // --- Відправка замовлення в Telegram ---
    function handleOrderSubmit(e) {
      e.preventDefault();

      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const address = document.getElementById('custAddress').value;
      const payment = document.getElementById('custPayment').value;
      const comment = document.getElementById('custComment').value;

      let total = 0;
      let itemsText = cart.map((item, i) => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        const opts = Object.entries(item.options).map(([k,v]) => `${k}: ${v}`).join(', ');
        return `${i+1}. ${item.title} ${opts ? `(${opts})` : ''}\n   ${item.qty} шт. х ${item.price} грн = ${itemTotal} грн`;
      }).join('\n');

      const text = `🛍 **НОВЕ ЗАМОВЛЕННЯ** ${IS_OPT ? '(ОПТ)' : ''}\n\n` +
                   `👤 **Покупець:** ${name}\n` +
                   `📞 **Телефон:** ${phone}\n` +
                   `📍 **Доставка:** ${address}\n` +
                   `💳 **Оплата:** ${payment}\n` +
                   (comment ? `💬 **Коментар:** ${comment}\n` : '') +
                   `\n📦 **Товари:**\n${itemsText}\n\n` +
                   `💰 **Усього до сплати:** ${total} грн`;

      // Надсилання запиту до Telegram API
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: text,
          parse_mode: 'Markdown'
        })
      })
      .then(res => {
        if (res.ok) {
          cart = [];
          updateCartCount();
          closeModal('checkoutModal');
          showToast("🎉 Замовлення успішно відправлено!");
          if (tg) tg.close();
        } else {
          showToast("❌ Помилка відправки замовлення!");
        }
      })
      .catch(() => showToast("❌ Мережева помилка. Перевірте з'єднання!"));
    }

    // --- Допоміжні функції ---
    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2500);
    }
  </script>
</body>
</html>
